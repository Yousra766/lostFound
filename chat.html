<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Conversation</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <div class="user-avatar"></div>
                <div class="user-info">
                    <h2 class="username">Yousra senouci</h2>
                    <span class="status-indicator">
                        <span class="status-dot"></span>
                        Online
                    </span>
                </div>
            </div>
            <div class="header-right">
                <button class="header-btn call-btn" title="Call">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                </button>
                <button class="header-btn more-btn" title="More options">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="5" r="2"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                        <circle cx="12" cy="19" r="2"></circle>
                    </svg>
                </button>
                <button class="header-btn view-profile-btn">View Profile</button>
            </div>
        </header>

        <!-- Chat Messages Area -->
        <main class="chat-messages" id="chatMessages">
        </main>

        <!-- Message Input Area -->
        <footer class="chat-footer">
            <div class="input-container">
                <input 
                    type="text" 
                    class="message-input" 
                    id="messageInput" 
                    placeholder="Type a message..."
                >
                <button class="input-btn attachment-btn" id="attachmentBtn" title="Attach image">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 0 19.8 4.3M22 12.5a10 10 0 0 0-19.8-4.2"></path>
                    </svg>
                </button>
                <button class="input-btn emoji-btn" id="emojiBtn" title="Insert emoji">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="9" cy="9" r="1.5" fill="white"></circle>
                        <circle cx="15" cy="9" r="1.5" fill="white"></circle>
                        <path d="M8 14c1 1 2 2 4 2s3-1 4-2" stroke="white" stroke-width="2" fill="none"></path>
                    </svg>
                </button>
                <button class="send-btn" id="sendBtn" title="Send message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 C22.9702544,11.6889879 22.9702544,11.5318905 22.9702544,11.4744748 L22.9702544,11.3173773 C22.9702544,10.3747931 22.6563168,9.43220865 21.714504,8.96091648 L4.13399899,0.163462733 C3.34915502,0.0636533864 2.40734225,-0.0363559368 1.77946707,0.597785966 C0.994623095,1.38328144 0.837654326,2.47306256 1.15159189,3.25855715 L3.03521743,9.69953914 C3.03521743,9.85663655 3.19218622,10.0137339 3.50612381,10.0137339 L16.6915026,10.7992209 C16.6915026,10.7992209 17.1624089,10.7992209 17.1624089,10.3179286 L17.1624089,11.2605127 C17.1624089,11.3173773 17.1624089,11.4744748 16.6915026,11.4744748 C16.6915026,11.4744748 16.0636274,11.4744748 16.6915026,12.4744748 Z"></path>
                    </svg>
                </button>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </footer>

        <!-- Emoji Picker Modal -->
        <div class="emoji-picker" id="emojiPicker" style="display: none;">
            <div class="emoji-grid">
                <span class="emoji" data-emoji="😀">😀</span>
                <span class="emoji" data-emoji="😂">😂</span>
                <span class="emoji" data-emoji="😍">😍</span>
                <span class="emoji" data-emoji="🤔">🤔</span>
                <span class="emoji" data-emoji="😎">😎</span>
                <span class="emoji" data-emoji="😊">😊</span>
                <span class="emoji" data-emoji="😢">😢</span>
                <span class="emoji" data-emoji="😡">😡</span>
                <span class="emoji" data-emoji="😴">😴</span>
                <span class="emoji" data-emoji="🤗">🤗</span>
                <span class="emoji" data-emoji="😵">😵</span>
                <span class="emoji" data-emoji="🤣">🤣</span>
                <span class="emoji" data-emoji="👋">👋</span>
                <span class="emoji" data-emoji="👍">👍</span>
                <span class="emoji" data-emoji="👎">👎</span>
                <span class="emoji" data-emoji="🙏">🙏</span>
                <span class="emoji" data-emoji="❤️">❤️</span>
                <span class="emoji" data-emoji="💔">💔</span>
                <span class="emoji" data-emoji="💪">💪</span>
                <span class="emoji" data-emoji="🎉">🎉</span>
                <span class="emoji" data-emoji="✨">✨</span>
                <span class="emoji" data-emoji="🔥">🔥</span>
                <span class="emoji" data-emoji="⚡">⚡</span>
                <span class="emoji" data-emoji="💯">💯</span>
            </div>
        </div>

        <!-- Call Modal -->
        <div class="call-modal" id="callModal" style="display: none;">
            <div class="call-modal-content">
                <div class="call-avatar"></div>
                <h3>Calling Yousra senouci...</h3>
                <button class="end-call-btn">End Call</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
