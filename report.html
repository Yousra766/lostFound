<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Item</title>
    <link rel="stylesheet" href="report-styles.css">
</head>
<body>
    <div class="container">
        <div class="form-header">
            <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <h1>Report an Item</h1>
        </div>

        <!-- FORMULAIRE -->
        <form id="reportForm" class="report-form" action="forlulaire.php" method="POST" enctype="multipart/form-data">
            <!-- Item Type -->
            <div class="form-group">
                <label for="itemType">Item Type <span class="required">*</span></label>
                <input type="text" id="itemType" name="item_type" placeholder="Exp : sac a dos, téléphone..." required>
            </div>

            <!-- Category -->
            <div class="form-group">
                <label for="category">Category <span class="required">*</span></label>
                <select id="category" name="category" required>
                    <option value="">choose a category</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Documents">Documents</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Date -->
            <div class="form-group">
                <label for="date">Date <span class="required">*</span></label>
                <div class="date-input-wrapper">
                    <input type="date" id="date" name="date_found" required>
                    <svg class="calendar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
            </div>

            <!-- Location -->
            <div class="form-group">
                <label for="location">Location <span class="required">*</span></label>
                <input type="text" id="location" name="location" placeholder="Exp : Amphi 5, Salle N201..." required>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">Description <span class="required">*</span></label>
                <textarea id="description" name="description" placeholder="Describe the item" rows="5" required></textarea>
            </div>

            <!-- Item Photo -->
            <div class="form-group">
                <label for="photo">Item Photo <span class="required">*</span></label>
                <div class="file-input-wrapper">
                    <input 
                         type="file" 
                          id="photo" 
                          name="photo" 
                           accept="image/*" />
                                                    
                    <div class="file-input-label">Click to upload or drag and drop</div>
                </div>
            </div>

            <!-- Hidden Status -->
            <input type="hidden" name="status" value="Lost">

            <!-- Action Buttons -->
            <div class="form-actions">
                <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn-submit">Report Item</button>
            </div>
        </form>
    </div>

   <script src="report-script.js"></script>

</body>
</html>
